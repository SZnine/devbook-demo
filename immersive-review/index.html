<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191a1c" />
    <script>
      try {
        const theme = localStorage.getItem('read-appearance') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.readTheme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.lang = localStorage.getItem('read-language') === 'zh-CN' ? 'zh-CN' : 'en';
      } catch {}
    </script>
    <style>html[data-read-theme="dark"],html[data-read-theme="dark"] body{background:#101113}</style>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23191919'/%3E%3Cpath d='M7 6h18v20H7zM16 6v20' fill='none' stroke='%23cccccc' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Read · Notes, reading &amp; memory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
